<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Anime - MyWebsite</title>
  <link href="./output.css" rel="stylesheet">
  <script src="./anime.js" defer></script>
</head>
<body class="bg-gray-50">
  <header class="bg-primary text-white px-6 py-4 flex items-center justify-between">
    <h1 class="font-bold">MyWebsite</h1>
    <a href="./index.html" class="hover:underline">&larr; Kembali</a>
  </header>

  <main class="px-6 py-10">
    <h2 class="text-2xl font-bold text-center mb-2">Top Anime</h2>
    <p class="text-center text-gray-600 mb-8">Data diambil dari Kitsu API (GET https://kitsu.io/api/edge/anime)</p>

    <p id="loading" class="text-center text-gray-600">Memuat data anime...</p>

    <div id="error" class="hidden max-w-md mx-auto bg-red-100 text-red-700 p-4 rounded text-center">
      <p id="error-text"></p>
      <button id="retry-btn" class="mt-3 bg-red-600 text-white px-4 py-1 rounded">Coba lagi</button>
    </div>

    <div id="anime-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </main>
</body>
</html>
